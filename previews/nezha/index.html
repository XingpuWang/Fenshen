<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>哪吒 · 角色与技能美术预览</title>
<style>
@font-face{font-family:Shanhe;src:url('../../assets/fonts/ShanheSerif.otf')}*{box-sizing:border-box}body{margin:0;background:#171a1d;color:#eee3ce;font:14px/1.6 system-ui,sans-serif}button,select,input{font:inherit}button,select{background:#262a2c;color:#e6d9c2;border:1px solid #48433b;border-radius:7px;padding:8px 13px;cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:#efbb6a;outline:2px solid #efbb6a55;outline-offset:2px}button[aria-pressed=true]{background:#6d3128;border-color:#d99d63;color:#fff3d8}header{max-width:1520px;margin:auto;padding:26px 32px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c6a57626}.eyebrow{font-size:11px;letter-spacing:3px;color:#d9a86b}h1{font:32px Shanhe,serif;margin:5px 0 0;font-weight:400}h1 span{font:13px system-ui;color:#b1a799;margin-left:16px}.badge{border:1px solid #b99a5b60;color:#e6bf7b;border-radius:30px;padding:6px 13px;font-size:12px}main{max-width:1520px;margin:24px auto;padding:0 32px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.card{border:1px solid #c6a57628;border-radius:12px;background:#202326;overflow:hidden}.portrait{position:relative;background:radial-gradient(ellipse at 50% 45%,#63352f,#202326 75%);padding-top:12px}.portrait img{display:block;width:100%;height:405px;object-fit:contain}.portrait-label{position:absolute;left:18px;top:18px;font:22px Shanhe,serif;color:#f9dfae;writing-mode:vertical-rl;letter-spacing:8px}.side-info{padding:17px 18px;border-top:1px solid #c6a57628}.side-info p{margin:8px 0;color:#bcb5a9;font-size:12px}.portraits{display:flex;gap:10px;margin:14px 0}.portrait-crop{background:#46382f;border:1px solid #c6a57650;border-radius:6px;display:block}.crop-caption{font-size:11px;color:#9e998f;text-align:center;margin-top:4px}.side-info strong{font-size:13px;font-weight:500;color:#ead4b1}.stage-top{padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;background:#222527}.stage-top strong{font-family:Shanhe,serif;font-weight:400;font-size:20px}.stage-top span{font-size:11px;color:#b3a992}.stage-wrap{background:#161b20;line-height:0}#stage{width:100%;aspect-ratio:1100/650;display:block}.controls{padding:14px 18px;background:#202326;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{display:inline-flex;align-items:center;gap:6px;color:#bab5a8;font-size:12px}.controls select{padding:5px 7px;font-size:12px}.timeline{display:flex;align-items:center;gap:12px;padding:0 18px 16px;color:#b9b1a2;font-variant-numeric:tabular-nums;font-size:12px}#time{flex:1;accent-color:#d19b5b;min-width:100px}.clip-panel{margin-top:16px;padding:18px}.section-label{color:#bfa178;font-size:11px;letter-spacing:2px;margin-bottom:9px}.clip-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.clip-buttons button{font-size:12px;padding:7px 12px}.description{margin:2px 0 12px;color:#b8b2a8;font-size:12px}.frames{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.frame{padding:0;overflow:hidden;background:#2a2d30;border-color:#48433b;border-radius:6px}.frame canvas{display:block;width:100%;aspect-ratio:1}.frame span{display:block;font-size:10px;color:#b8ab98;padding:4px;border-top:1px solid #ffffff0d}.frame.current{border-color:#e8b66d;box-shadow:0 0 0 1px #e8b66d44}footer{max-width:1520px;margin:20px auto;padding:0 32px 30px;color:#807e76;font-size:11px}#loading{padding:80px;text-align:center}.error{color:#ffb8a2}.shortcut{color:#878b87;font-size:11px;margin-left:auto}@media(max-width:950px){main{grid-template-columns:190px 1fr;padding:0 18px;gap:16px}header{padding:18px}.portrait img{height:300px}.portrait-label{font-size:18px}.portraits{gap:5px}.portrait-crop{max-width:70px;height:auto}.side-info{padding:12px}h1{font-size:25px}h1 span{display:none}.frames{gap:3px}.controls{gap:7px}}@media(max-width:680px){main{display:flex;flex-direction:column;padding:0 12px}.sidebar{display:none}header{padding:16px}h1{font-size:24px}.badge{font-size:10px;padding:4px 8px}.controls label{font-size:11px}.clip-panel{padding:12px}.clip-buttons button{padding:6px 8px}footer{padding:0 16px 20px}.shortcut{display:none}}
</style>

<body>
<header><div><div class="eyebrow">封神 · 角色美术</div><h1>哪吒 <span>莲焰少年神将</span></h1></div><div class="badge">第二版 · 已移除风火轮</div></header>
<main>
<aside class="sidebar card">
<div class="portrait"><span class="portrait-label">莲焰少年</span><img id="portrait" alt="哪吒全身立绘，无风火轮"></div>
<div class="side-info"><strong>朱红 · 象牙白 · 鎏金</strong><p>同一张立绘用于大地图与战斗面板头像。</p><div class="portraits"><div><canvas class="portrait-crop" id="mapPortrait" width="90" height="108" aria-label="大地图人物头像裁切预览"></canvas><div class="crop-caption">大地图面板</div></div><div><canvas class="portrait-crop" id="battlePortrait" width="90" height="112" aria-label="战斗人物头像裁切预览"></canvas><div class="crop-caption">战斗面板</div></div></div><p>42 张人物动作帧<br>28 张独立特效帧<br>立绘与战斗造型基准图</p></div>
</aside>
<section>
<div class="card"><div class="stage-top"><strong id="clipName">正在加载</strong><span id="clipMeta">角色动作与独立特效预览</span></div><div class="stage-wrap"><canvas id="stage" width="1100" height="650" aria-label="哪吒动作和技能特效播放区域"></canvas></div><div class="controls"><button id="play" type="button" aria-label="暂停播放">暂停</button><button id="replay" type="button">重播</button><label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>背景 <select id="background" aria-label="预览背景"><option value="stage">深色</option><option value="light">浅色</option><option value="checker">棋盘格</option><option value="battle">战场</option></select></label><label>人物 <select id="scale" aria-label="人物展示尺寸"><option value="180">战斗尺寸 180</option><option value="320" selected>放大查看 320</option></select></label><label><input type="checkbox" id="effects" checked>特效</label><label><input type="checkbox" id="flip">朝左</label><span class="shortcut">空格：播放 / 暂停</span></div><div class="timeline"><span id="frameLabel">1 / 6</span><input id="time" type="range" min="0" max="2000" step="1" value="0" aria-label="动画时间轴"><span id="timeLabel">0.00 s</span></div></div>
<div class="card clip-panel"><div class="section-label">人物动作</div><div class="clip-buttons" id="actorClips"></div><div class="section-label">独立特效</div><div class="clip-buttons" id="fxClips"></div><p class="description" id="description"></p><div class="frames" id="frames"></div></div>
</section>
</main>
<footer>美术资源预览 · 支持逐帧查看、左右朝向与深浅背景检查。此套资源及灼烧规则已接入 Godot 项目；本页用于独立检查美术动作。</footer>
